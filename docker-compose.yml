# ============================================================================
# 家庭保险整理工具 — NAS 运行用 Compose 文件
# ----------------------------------------------------------------------------
# 怎么用？（两种方式，任选其一）
#   方式 A（推荐）：把这个文件用 SMB 拷到极空间 → 「Docker → Compose → 新增项目」
#                   → 点「导入」选择本文件 → 按下面【必须替换】改一处路径 → 创建
#   方式 B：打开本文件，把【】里的内容全部复制，粘贴到极空间的 Compose 编辑框里
#
# ⚠️ 使用前只需改【一处】：下面 volumes 里的那一行路径。
#    改法见那行的注释（点「查询路径」按钮即可，不用 SSH、不用记路径）。
#
# ⚠️ 注意：本文件【刻意不写 version: 那一行】。极空间的 Compose 不需要它，
#    写了反而可能报语法错误。
#
# 数据存在哪？
#   运行期数据都在容器内 /app/data 下，包含两部分：
#     ① SQLite 数据库：/app/data/insurance.db
#     ② 电子保单 PDF 附件：/app/data/attachments/（v1.2 新增）
#   下面 volumes 把整个 /app/data 映射到 NAS 上的一个文件夹，
#   因此【数据库与 PDF 附件一起持久化，容器删了都不丢】。
#   备份时只需复制那个文件夹即可。
# ============================================================================

services:
  insurance-tool:
    # 导入到极空间的本镜像（导入后镜像名与此一致，不要改）
    image: family-insurance-manager:1.7.0
    container_name: family-insurance-manager

    ports:
      # 左:右 = NAS对外端口:容器内端口。右边 8000 不要动。
      # 若 8000 被占用导致创建失败，把【左边】改成 18000，
      # 之后浏览器就用 http://<NAS的IP>:18000 访问。
      - "8000:8000"

    environment:
      # 时区：让日志时间正确（东八区）
      TZ: Asia/Shanghai
      # 数据库路径：与下方 volumes 的容器侧路径保持一致
      DB_PATH: /app/data/insurance.db
      # 服务监听端口：与上方 ports 的【右边】保持一致
      PORT: "8000"

    volumes:
      # ⚠️⚠️ 必须替换这一行 ⚠️⚠️
      # 冒号【左边】是 NAS 上的真实文件夹路径，冒号右边 /app/data 不要动。
      #
      # 怎么拿到左边这个路径（不用 SSH，不用记）：
      #   1. 在极空间 Compose 编辑框里，点输入框上方的「查询路径」按钮
      #   2. 在弹出的文件管理器里，选中你想用来存数据的文件夹
      #      （建议先在「文件」App 里新建一个空文件夹，例如 Docker/insurance/data）
      #   3. 点「复制路径」，回到编辑框，把下面整行冒号左边替换成复制到的路径
      #
      # 下面这行是【示例占位符】，直接创建会失败，请务必替换：
      - /REPLACE_ME/data:/app/data

    restart: unless-stopped
